<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Nova AI</title>
  <link rel="icon" type="image/png" href="images/favicon/favicon.png" />
  <link rel="apple-touch-icon" href="images/favicon/favicon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Nova AI" />
  <meta property="og:title" content="Nova AI" />
  <meta property="og:description" content="Nova AI — your personal AI assistant by jymer1102." />
  <meta property="og:image" content="https://i.imgur.com/UyC7wbr.png" />
  <meta property="og:url" content="https://nova-ai-mk9x.onrender.com" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:image" content="https://i.imgur.com/UyC7wbr.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="auth-screen">
  <div class="auth-box">
    <h1><i class="fa-solid fa-star"></i> Nova AI <i class="fa-solid fa-star"></i></h1>
    <p id="auth-subtitle">Sign in to your account</p>
    <input type="text" id="auth-name" placeholder="Your name" style="display:none" />
    <input type="tel" id="auth-phone" placeholder="Phone number (optional)" style="display:none" />
    <input type="email" id="auth-email" placeholder="Email" />
    <input type="password" id="auth-password" placeholder="Password" />
    <p class="auth-error" id="auth-error"></p>
    <button class="primary" id="auth-submit">Sign In</button>
    <div style="display:flex;align-items:center;gap:0.5rem;margin:0.25rem 0">
      <div style="flex:1;height:1px;background:var(--border)"></div>
      <span style="color:var(--text-muted);font-size:0.8rem">or</span>
      <div style="flex:1;height:1px;background:var(--border)"></div>
    </div>
    <button class="primary" id="discord-btn" style="background:#5865F2"><i class="fa-brands fa-discord"></i> Continue with Discord</button>
    <button class="primary" id="github-btn" style="background:#333"><i class="fa-brands fa-github"></i> Continue with GitHub</button>
    <button class="auth-toggle" id="auth-toggle">Don't have an account? Sign up</button>
  </div>
</div>

<div id="app">
  <div id="sidebar">
    <div id="sidebar-header">
      <i class="fa-solid fa-comment"></i> Chat History
      <div style="display:flex;gap:0.5rem;align-items:center">
        <button id="clear-all-btn"><i class="fa-solid fa-trash-can"></i> Clear All</button>
        <button class="icon-btn" id="close-sidebar">✕</button>
      </div>
    </div>
    <div id="sidebar-list"></div>
  </div>
  <div id="overlay"></div>
  <header>
    <div style="display:flex;gap:0.5rem">
      <button class="icon-btn" id="history-btn" title="Chat history"><i class="fa-solid fa-comment"></i></button>
      <button class="icon-btn" id="new-chat-btn" title="New chat"><i class="fa-solid fa-pencil"></i></button>
    </div>
    <span class="header-title" id="header-title"><i class="fa-solid fa-star"></i>Nova AI by jymer1102<i class="fa-solid fa-star"></i></span>
    <div class="header-btns" id="header-btns">
      <button class="icon-btn" id="theme-btn" title="Toggle theme"><i class="fa-solid fa-moon"></i></button>
      <button class="icon-btn" id="clear-btn" title="Clear chat"><i class="fa-solid fa-trash-can"></i></button>
      <button class="icon-btn" id="logout-btn" title="Log out"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      <button class="icon-btn" id="profile-btn" title="Profile">
        <img id="profile-icon" src="" style="display:none;width:100%;height:100%;object-fit:cover;border-radius:8px;" />
        <span id="profile-icon-fallback"><i class="fa-solid fa-circle-user"></i></span>
      </button>
    </div>
  </header>
  <div id="chat"></div>
  <div id="input-area">
    <div id="preview-area">
      <img id="preview-img" src="" alt="preview" />
      <button id="remove-img">✕</button>
    </div>
    <div id="bottom-row">
      <button class="tool-btn" id="upload-btn" title="Upload image"><i class="fa-solid fa-paperclip"></i></button>
      <input type="file" id="file-input" accept="image/*" style="display:none" />
      <button class="tool-btn" id="mic-btn" title="Voice input"><i class="fa-solid fa-microphone"></i></button>
      <textarea id="input" placeholder="Type a message..."></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="profile-modal">
  <div class="modal-box">
    <h2 style="font-size:1.2rem;font-weight:600"><i class="fa-solid fa-circle-user"></i> Profile Settings</h2>
    
   <div id="profile-upload-section" class="nova-glass-panel" style="width: 100%; text-align: center; box-sizing: border-box;">
      <img id="profile-preview" src="https://via.placeholder.com/100" alt="Profile" width="100" height="100" style="display: block; margin: 0 auto 15px auto; border-radius: 50%; object-fit: cover; border: 2px solid rgba(255,255,255,0.4); background: var(--surface2);" />
      
      <label for="avatar-upload" class="glass-btn">Update Photo</label>
      <input type="file" id="avatar-upload" accept="image/jpeg, image/png, image/webp" style="display:none;" />
    </div>
    <input type="text" id="profile-name" class="modal-input" placeholder="New name" />
    <input type="email" id="profile-email" class="modal-input" placeholder="New email" />
    <input type="password" id="profile-password" class="modal-input" placeholder="New password" />
    <p id="profile-msg" style="font-size:0.85rem;text-align:center;color:var(--text-muted)"></p>
    <div style="display:flex;gap:0.5rem">
      <button id="profile-save" class="modal-btn" style="flex:1;background:var(--accent);color:white"><i class="fa-solid fa-floppy-disk"></i> Save</button>
      <button id="profile-close" class="modal-btn" style="flex:1;background:var(--surface2);color:var(--text);border:1px solid var(--border)"><i class="fa-solid fa-ban"></i> Cancel</button>
    </div>
    <button id="profile-delete" class="modal-btn" style="width:100%;background:#c0392b;color:white"><i class="fa-solid fa-trash-can"></i> Delete Account</button>
  </div>
</div>


<canvas id="backpack-egg-canvas"></canvas>
<div id="backpack-egg-overlay">
  <div id="backpack-egg-wrap">🎒</div>
  <div id="backpack-egg-label"><i class="fa-solid fa-bomb"></i> ALLAHU AKBAR <i class="fa-solid fa-bomb"></i></div>
</div>

<script src="js/config.js"></script>
<script src="js/utils.js"></script>
<script src="js/auth.js"></script>
<script src="js/profile.js"></script>
<script src="js/ui.js"></script>
<script src="js/chat.js"></script>
<script src="js/easter-eggs.js"></script>
</body>
</html>
